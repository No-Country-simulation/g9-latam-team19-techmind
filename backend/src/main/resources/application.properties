spring.application.name=backend

# MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/techmind
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# FLYWAY (Gestión de migraciones)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA hibernate
# 'validate' asegura que Hibernate no cree/modifique tablas, solo valida contra la BD
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# FastAPI
python.api.url=http://localhost:8000

# Permite que la API de documentación no falle si encuentra clases complejas
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true